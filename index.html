<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuaderno de Matrices — Calculadora paso a paso</title>
    <meta name="description" content="Calculadora de matrices con resolución paso a paso, modo oscuro, diseño responsive e historial local tipo cuaderno técnico." />
    <meta name="theme-color" content="#FAF9F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10131A" media="(prefers-color-scheme: dark)" />
    <script>
      // Se aplica el tema antes de pintar la página para evitar un parpadeo
      // del tema incorrecto (flash of unstyled theme) al cargar.
      ;(function () {
        try {
          var stored = localStorage.getItem('matrix-calculator:theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = stored ? stored === 'dark' : prefersDark
          if (isDark) document.documentElement.classList.add('dark')
        } catch (err) {
          /* localStorage puede fallar en modo privado; se ignora y se usa el tema claro por defecto */
        }
      })()
    </script>

      rel="stylesheet"
